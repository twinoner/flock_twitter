services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: twitter_clon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: twitter_clon
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${VITE_APP_PORT:-80}}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "php artisan migrate:fresh --seed --force && php artisan serve --host=0.0.0.0 --port=${API_PORT:-8000}"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "${VITE_APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
